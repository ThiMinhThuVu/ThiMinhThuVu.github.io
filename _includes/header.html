<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
  <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false" type="button">
    <span class="sr-only">Toggle navigation</span><span></span><span></span><span></span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
